# Matrix exploration: Bad-PFL x FedBN under a pathological partition.
# Partition strength knob = class_per_client (fewer classes => stronger skew).
name: badpfl_fedbn_pathological_c2

dataset: cifar10
data_root: ${DATA_ROOT}   # 含 cifar-10-batches-py/ 的父目录；外部 HPC 路径，运行时由 env/--data-root 注入
num_classes: 10
partition: pathological
class_per_client: 2
balance: true

fl_method: fedbn
model: resnet10
client_num: 100
bad_client_num: 10
select_client_num_per_round: 10
total_round: 1000
client_local_step: 15
client_batch: 32
learning_rate: 0.1
agg_rule: avg

attack: bad_pfl
attack_params:
  target_label: 0
  poison_rate: 0.2
  epsilon: 0.01568627451
  sigma: 0.01568627451
  gen_lr: 0.01
  gen_steps: 30

defense: null
seed: 2024
device: cuda:0
