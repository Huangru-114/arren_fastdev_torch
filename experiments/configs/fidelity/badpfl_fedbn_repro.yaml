# Bad-PFL vs FedBN -- fidelity reproduction of ICLR 2025 Table 1 (CIFAR-10).
# Paper reports FedBN: Acc 80.72 / ASR 82.22.
# Heavy: 100 clients x 1000 rounds -- Tier B (HPC), submit manually.
name: badpfl_fedbn_repro

dataset: cifar10
num_classes: 10
input_channel: 3
partition: dirichlet
dir_alpha: 0.5

fl_method: fedbn
model: resnet10
client_num: 100
bad_client_num: 10
select_client_num_per_round: 10
total_round: 1000
client_local_step: 15
client_batch: 32
learning_rate: 0.1
agg_rule: avg

attack: bad_pfl
attack_params:
  target_label: 0
  poison_rate: 0.2
  epsilon: 0.01568627451   # 4/255
  sigma: 0.01568627451     # 4/255
  gen_lr: 0.01
  gen_steps: 30
  pgd_iter: 1

defense: null
seed: 2024
device: cuda:0
